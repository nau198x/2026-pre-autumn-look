    <section class="ec" aria-label="オンラインストア" data-animate>
      <a
        class="ec__link"
        href="https://example.com/"
        target="_blank"
        rel="noopener"
        >ONLINE STORE</a
      >
    </section>

    <footer class="footer">
      <div class="footer__logo">
        <p>
          <a href="https://example.com/" target="_blank" rel="noopener"
            ><img
              src="src/assets/images/logo.svg"
              loading="lazy"
              alt="BRAND NAME"
              width="90"
              height="30"
          /></a>
        </p>
      </div>

      <nav class="footer__links" aria-label="関連リンク">
        <a href="https://example.com/" target="_blank" rel="noopener"
          >ONLINE STORE</a
        ><span>|</span>
        <a href="https://example.com/" target="_blank" rel="noopener"
          >STAFF STYLING</a
        ><span>|</span>
        <a href="https://example.com/" target="_blank" rel="noopener"
          >OTHER CONTENTS</a
        >
      </nav>

      <div class="footer__sns">
        <p class="footer__sns-title">Follow us</p>
        <div class="footer__sns-icons">
          <a href="https://example.com/" target="_blank" rel="noopener"
            ><img
              src="src/assets/images/icon_instagram.svg"
              loading="lazy"
              alt="Instagram"
              width="33"
              height="33"
          /></a>
          <a href="https://example.com/" target="_blank" rel="noopener"
            ><img
              src="src/assets/images/icon_facebook.svg"
              loading="lazy"
              alt="Facebook"
              width="33"
              height="33"
          /></a>
          <a href="https://example.com/" target="_blank" rel="noopener"
            ><img
              src="src/assets/images/icon_x.svg"
              loading="lazy"
              alt="X"
              width="33"
              height="33"
          /></a>
        </div>
      </div>

      <p class="footer__copyright">&copy; BRAND NAME ALL RIGHTS RESERVED.</p>
    </footer>

    <script type="module" src="/src/scripts/main.js"></script>
  </body>
